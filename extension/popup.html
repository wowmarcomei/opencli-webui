<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      padding: 14px;
      background: #fff;
      color: #1d1d1f;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .mark {
      width: 22px; height: 22px; border-radius: 6px;
      background: #111827; color: #22d3ee;
      display: grid; place-items: center;
      font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    h1 { flex: 1; font-size: 14px; font-weight: 650; }
    .version-tag { color: #86868b; font-size: 11px; font-variant-numeric: tabular-nums; }
    .card { border: 1px solid #ececec; border-radius: 10px; overflow: hidden; }
    .status-row, .profile-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
    }
    .status-row { background: #fafafa; }
    .profile-row { border-top: 1px solid #ececec; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    .dot.connected { background: #34c759; }
    .dot.connecting { background: #ff9500; }
    .dot.disconnected { background: #ff3b30; }
    .status-text { flex: 1; font-weight: 650; }
    .daemon-version, .profile-label { color: #86868b; font-size: 11px; }
    .profile-id {
      flex: 1;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-all;
      user-select: all;
    }
    .copy-btn, .save-btn {
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      background: #fff;
      color: #007aff;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
    }
    .copy-btn { padding: 4px 9px; }
    .save-btn { height: 30px; padding: 0 10px; }
    .save-btn.primary { background: #111827; border-color: #111827; color: #fff; }
    .settings {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    label {
      display: grid;
      gap: 4px;
      color: #52525b;
      font-size: 11px;
    }
    input {
      width: 100%;
      height: 30px;
      border: 1px solid #d2d2d7;
      border-radius: 7px;
      padding: 0 8px;
      color: #1d1d1f;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      outline: none;
    }
    input:focus { border-color: #007aff; box-shadow: 0 0 0 2px rgba(0,122,255,.12); }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
    .hint {
      margin-top: 10px;
      color: #6e6e73;
      font-size: 11px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="mark">&gt;</span>
    <h1>OpenCLI Remote</h1>
    <span class="version-tag" id="extVersion"></span>
  </div>

  <div class="card" id="card">
    <div class="status-row">
      <span class="dot disconnected" id="dot"></span>
      <span class="status-text" id="status">Checking...</span>
      <span class="daemon-version" id="daemonVersion"></span>
    </div>
    <div class="profile-row" id="profileRow" style="display:none">
      <span class="profile-label">Profile</span>
      <span class="profile-id" id="contextId"></span>
      <button type="button" class="copy-btn" id="copyBtn">Copy</button>
    </div>
  </div>

  <div class="settings">
    <label>
      WebUI URL
      <input id="bridgeUrl" placeholder="https://example.com">
    </label>
    <label>
      Token
      <input id="bridgeToken" type="password" placeholder="OPENCLI_BRIDGE_TOKEN">
    </label>
    <div class="actions">
      <button type="button" class="save-btn" id="reconnectBtn">Reconnect</button>
      <button type="button" class="save-btn primary" id="saveBtn">Save</button>
    </div>
  </div>

  <p class="hint">Install only this extension locally. The OpenCLI CLI and WebUI can run on the remote Linux server.</p>
  <script src="popup.js"></script>
</body>
</html>
